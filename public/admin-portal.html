<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07142f">
  <meta name="description" content="Private Kingdom Bible account administration portal.">
  <title>Kingdom Bible Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-32.png" sizes="32x32">
  <link rel="icon" href="/icons/icon-48.png" sizes="48x48">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="mask-icon" href="/favicon.svg" color="#07142f">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="admin-shell">
    <div class="admin-brand">
      <img src="/assets/logo.png" alt="Kingdom Bible">
      <div>
        <div class="eyebrow">SECURE ADMIN PORTAL</div>
        <h1>Kingdom Bible</h1>
        <p>Subscriptions, access grants, referrals and payout review.</p>
      </div>
    </div>
    <section id="adminApp" aria-busy="true">
      <div class="card admin-card admin-login-card" role="status">
        <h2>Checking administrator session</h2>
        <p>Connecting to the private account service…</p>
      </div>
    </section>
  </main>
  <div id="adminToast" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <div id="adminModalRoot" class="admin-modal-root" hidden></div>
  <script src="/admin.js" defer></script>
</body>
</html>
