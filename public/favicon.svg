<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kingdom Bible">
  <!-- Vector twin of public/assets/logo.png: crown, "K" monogram and open book.
       The PNG icons are generated FROM the raster master by scripts/icons.js, so the
       tab favicon and the installed-app icon can never drift apart again.
       Brand navy #07142f, gold #f5d778. -->
  <defs>
    <linearGradient id="kbGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset=".45" stop-color="#f5d778"/>
      <stop offset="1" stop-color="#d9a520"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#07142f"/>
  <g fill="url(#kbGold)">
    <!-- crown -->
    <path d="M22 22.5 17.5 9.5 25.5 16.5 32 6.5 38.5 16.5 46.5 9.5 42 22.5Z"/>
    <rect x="22" y="24" width="20" height="4.2" rx="1.7"/>
    <!-- K monogram, simplified from the raster letterforms -->
    <path d="M23.4 33.4h4.6v6.1l6.6-6.1h5.8l-6.3 5.7 7.1 8.9h-6.1l-5.1-6.6-2 1.9v4.7h-4.6z"/>
  </g>
  <g fill="#f7f9ff">
    <!-- open book -->
    <path d="M32 45.5c-3.9-2.6-8.5-3.8-13.6-3.8v13.2c5.1 0 9.7 1.2 13.6 3.8z"/>
    <path d="M32 45.5c3.9-2.6 8.5-3.8 13.6-3.8v13.2c-5.1 0-9.7 1.2-13.6 3.8z"/>
  </g>
  <path d="M32 45.5v13.2" stroke="#f5d778" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>