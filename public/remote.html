<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#07142f" />
  <meta name="description" content="KINGDOM BIBLE live remote — drive a projector, vMix or OBS browser source from your phone." />
  <title>Live Remote — KINGDOM BIBLE</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="stylesheet" href="/remote.css" />
</head>
<body>
  <header class="bar">
    <span class="dot" id="linkDot" title="connection"></span>
    <strong>Live Remote</strong>
    <span class="ref" id="onScreenRef">—</span>
  </header>

  <main>
    <section class="now" id="nowCard" aria-live="polite">
      <div class="now-label">ON SCREEN NOW</div>
      <blockquote id="nowText">Waiting for Scripture…</blockquote>
      <div class="now-foot"><span id="nowMeta">Open Ministry Mode on the display to begin</span></div>
    </section>

    <section class="send">
      <form id="refForm" autocomplete="off">
        <label class="lab" for="refInput">Go to a passage</label>
        <div class="row">
          <input id="refInput" placeholder="luk 3 23" enterkeyhint="go" />
          <button class="send-btn" type="submit" aria-label="Send to display">SEND</button>
        </div>
        <ul class="sugg" id="sugg" hidden></ul>
      </form>
      <div class="hints">
        <button type="button" class="chip" data-go="John 3:16-18">John 3:16-18</button>
        <button type="button" class="chip" data-go="Psalms 23:1-3">Psalm 23</button>
        <button type="button" class="chip" data-go="Romans 8:28-30">Romans 8:28</button>
        <button type="button" class="chip" data-go="Philippians 4:6-8">Philippians 4</button>
        <button type="button" class="chip" data-go="Isaiah 40:31">Isaiah 40:31</button>
        <button type="button" class="chip" data-go="Proverbs 3:5-6">Proverbs 3:5</button>
      </div>
    </section>

    <section class="opts">
      <div class="opt">
        <span class="lab">Block size</span>
        <div class="spans" id="spans" role="group" aria-label="Passage block size">
          <button type="button" data-span="1" class="on">1</button>
          <button type="button" data-span="2">2</button>
          <button type="button" data-span="3">3</button>
          <button type="button" data-span="5">5</button>
          <button type="button" data-span="7">7</button>
          <button type="button" data-span="10">10</button>
        </div>
        <p class="note">NEXT keeps the same block size. Pick 3 to walk through a passage a stanza at a time.</p>
      </div>

      <div class="opt two">
        <label class="opt-field"><span class="lab">Translation</span>
          <select id="translation"></select>
        </label>
        <label class="opt-field"><span class="lab">Theme</span>
          <select id="theme">
            <option value="royal">Royal Gold</option>
            <option value="dark">Classic Black</option>
            <option value="light">Minimal White</option>
            <option value="transparent">Transparent (OBS overlay)</option>
          </select>
        </label>
      </div>

      <div class="opt two">
        <label class="opt-field"><span class="lab">Church / ministry</span>
          <input id="church" placeholder="KINGDOM BIBLE" />
        </label>
        <label class="opt-field"><span class="lab">Service timer</span>
          <span class="timer-row">
            <output id="timerOut">00:00:00</output>
            <button type="button" class="mini" id="timerToggle">Start</button>
            <button type="button" class="mini ghost" id="timerReset">Reset</button>
          </span>
        </label>
      </div>

      <div class="opt row2">
        <button type="button" class="mini wide" id="blankBtn">Blank screen</button>
        <button type="button" class="mini wide ghost" id="copyUrlBtn">Copy display URL</button>
      </div>
    </section>
  </main>

  <!-- Thumb zone: the two buttons that matter mid-service. -->
  <nav class="pad">
    <button type="button" class="step prev" id="prevBtn" aria-label="Previous passage">
      <span class="arrow">▲</span><span>PREVIOUS</span>
    </button>
    <button type="button" class="step next" id="nextBtn" aria-label="Next verse">
      <span class="arrow">▼</span><span id="nextLabel">NEXT VERSE</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/ref-parser.js" defer></script>
  <script src="/live-sync.js" defer></script>
  <script src="/remote.js" defer></script>
</body>
</html>
