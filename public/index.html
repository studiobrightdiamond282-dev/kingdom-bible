<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07142f" />
  <meta name="description" content="KINGDOM BIBLE — Read, study, understand, and live the Word." />
  <title>KINGDOM BIBLE</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.png" sizes="48x48" />
  <link rel="icon" href="/icons/icon-32.png" sizes="32x32" />
  <link rel="icon" href="/icons/icon-48.png" sizes="48x48" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="mask-icon" href="/favicon.svg" color="#07142f" />
  <meta name="apple-mobile-web-app-title" content="Kingdom Bible" />
  <!-- Link preview. Every url below MUST be absolute: crawlers ignore a relative
       og:image, so the shared hub link used to render as bare text with no picture.
       {{ORIGIN}} is filled in by server.js from the request host (or PUBLIC_URL) and
       must never be typed in here as a hostname. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="KINGDOM BIBLE" />
  <meta property="og:title" content="KINGDOM BIBLE" />
  <meta property="og:description" content="Read. Study. Understand. Live the Word. The complete Bible with study tools, a prayer journal and live ministry presentation." />
  <meta property="og:url" content="{{ORIGIN}}/" />
  <meta property="og:image" content="{{ORIGIN}}/assets/logo-social.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="KINGDOM BIBLE — a gold crown above the letters KB resting on an open Bible" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="KINGDOM BIBLE" />
  <meta name="twitter:description" content="Read. Study. Understand. Live the Word." />
  <meta name="twitter:image" content="{{ORIGIN}}/assets/logo-social.png" />
  <meta name="twitter:image:alt" content="KINGDOM BIBLE logo" />
  <link rel="canonical" href="{{ORIGIN}}/" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="offlineBar" class="offline-bar" hidden>You’re offline. Saved Bible content and personal data remain available.</div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <button class="brand" data-route="home" data-admin-trigger aria-label="Kingdom Bible home">
        <img src="/assets/logo.png" alt="" />
        <span><strong>KINGDOM</strong><small>BIBLE</small></span>
      </button>
      <nav id="desktopNav" class="side-nav"></nav>
      <div class="side-footer">
        <button class="install-card" id="installBtn" hidden><span class="icon">⇩</span><span><strong>Install app</strong><small>Offline access & faster reading</small></span></button>
        <div class="profile-chip"><div id="sideAvatar" class="avatar">S</div><span><strong id="sideName">Stanley</strong><small>Local profile</small></span><button class="icon-btn" data-route="profile" aria-label="Profile settings">•••</button></div>
      </div>
    </aside>

    <header class="topbar">
      <button class="mobile-brand" data-route="home" data-admin-trigger><img src="/assets/logo.png" alt="Kingdom Bible" /></button>
      <button id="backBtn" class="icon-btn back-btn" aria-label="Go to previous page" title="Back (Backspace)" hidden>‹</button>
      <div class="crumb"><span id="pageEyebrow">KINGDOM BIBLE</span><strong id="pageTitle">Home</strong></div>
      <button id="commandBtn" class="command-trigger" aria-label="Open command search"><span>⌕</span><span>Search Scripture & tools</span><kbd>⌘ K</kbd></button>
      <div class="top-actions">
        <button id="themeBtn" class="icon-btn" aria-label="Change appearance">◐</button>
        <button id="notifBtn" class="icon-btn" aria-label="Notifications">♢</button>
        <button class="avatar top-avatar" data-route="profile" aria-label="Open profile">S</button>
      </div>
    </header>

    <div id="trialBanner" class="trial-banner" hidden></div>
  <main id="main" tabindex="-1"><div class="loading-screen"><img src="/assets/logo.png" alt=""/><span></span><p>Preparing the Word…</p></div></main>

    <nav id="mobileNav" class="mobile-nav" aria-label="Mobile navigation"></nav>
    <button id="quickBtn" class="quick-fab" aria-label="Quick actions">+</button>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <script src="/hub-probe.js" defer></script>
  <script src="/qr.js" defer></script>
  <script src="/bible-ref.js" defer></script>
  <script src="/devotionals.js" defer></script>
  <script src="/voice.js" defer></script>
  <script src="/premium.js" defer></script>
  <script src="/app.js" defer></script>
  <script src="/auth-fix.js" defer></script>
  <script src="/profile-fix.js" defer></script>
  <script src="/reader-fix.js" defer></script>
  <script src="/study-fix.js" defer></script>
  <script src="/audit-fix.js" defer></script>
</body>
</html>
